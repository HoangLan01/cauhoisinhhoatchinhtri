# =====================================================================
# CẤU HÌNH NGINX TỐI ƯU BẢO MẬT & HIỆU NĂNG - HỘI THI PHƯỜNG TÙNG THIỆN
# Đường dẫn cài đặt trên VPS Ubuntu: /etc/nginx/sites-available/quiz_tung_thien.conf
# =====================================================================

# 1. Chuyển hướng toàn bộ HTTP (Port 80) sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cau-hoi.phuongtungthien.vn;

    # Cho phép Let's Encrypt Certbot xác thực SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Server Block chính với SSL (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cau-hoi.phuongtungthien.vn;

    # Chứng chỉ SSL (Cấu hình tự động bởi Certbot)
    # ssl_certificate /etc/letsencrypt/live/cau-hoi.phuongtungthien.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/cau-hoi.phuongtungthien.vn/privkey.pem;

    # SSL hardening protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Giới hạn dung lượng tải lên tối đa (Ngăn chặn tràn bộ đệm)
    client_max_body_size 256k;

    # Security Headers gia cố
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bật nén Gzip giảm tải băng thông
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/x-font-ttf;

    # Proxy tới Node.js Backend chạy cổng 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Chuyển tiếp Header chuẩn IP người dùng thực tế
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình Timeout ngắn chống treo kết nối
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Cache tĩnh cho tài nguyên css, js, hình ảnh (Giảm 90% tải CPU Node.js)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Tuyệt đối KHÔNG cache các API động
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vô hiệu hóa cache cho API
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }
}
